<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>StableUp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <!-- Navbar -->
    <nav id="navbar"></nav>

    <main class="container my-4 d-flex flex-column text-center">

        <!-- Button trigger modal -->
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
            Launch static backdrop modal
        </button>

        <!-- Modal -->
        <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
            aria-labelledby="staticBackdropLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="staticBackdropLabel">Crear hábito</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form action="">
                            <div class="mb-3">
                                <label for="fullName" class="form-label">Nombre del habito</label>
                                <input type="text" class="form-control" id="fullName" placeholder="Leer">
                            </div>
                            <div>
                                <label for="language" class="form-label">Tipo de hábito</label>
                                <select class="form-select">
                                    <option selected>Elegir</option>
                                    <option value="fuerza">Fuerza</option>
                                    <option value="bienestar">Bienestar</option>
                                    <option value="salud">Salúd Mental</option>
                                </select>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary">Crear</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-5">
            <!-- Datos -->
            <div class="col-md-8" id="datos-usuario"></div>

            <div class="col-md-4" id="lista-habitos"></div>
        </div>

        <div class="border bg-white rounded" id="lista-caballos"></div>

        <!-- TODO: Footer -->

    </main>

    <script src="config/apiConfig.js"></script>
    <script type="module" src="pages/paginaDetalle.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
