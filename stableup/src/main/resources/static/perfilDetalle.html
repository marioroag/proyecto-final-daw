<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>StableUp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <main class="justify-content-center align-items-center text-center">
        <a href="index.html">
            <h1>StableUp</h1>
        </a>

        <div class="" id="datos-usuario"></div>

        <div id="lista-habitos">
            <div id="carouselExampleControls" class="carousel slide w-75 my-3 d-inline-block border border-primary"
                style="height: 400px;" data-bs-ride="carousel">
                <!-- TERMINAR DE IMPLEMENTAR HABITOS EN CARRUSEL -->
                <div class="carousel-inner" id="carrusel-habitos"></div>

                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>

        <div id="lista-caballos"></div>
    </main>

    <script src="config/apiConfig.js"></script>
    <script src="js/datosUsuario.js"></script>
    <script type="module" src="js/usuario.js"></script>
    <script type="module" src="js/usuarioHabitos.js"></script>
    <script type="module" src="js/usuarioCaballos.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
