<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>StableUp</title>
  <link rel="icon" sizes="64x64" href="/images/icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <!-- Hero -->

  <main class="container d-flex flex-column justify-content-center align-items-center text-center min-vh-100">

    <div id="modalCrearUsuario"></div>

    <h1 class="display-3 fw-bold mb-3">🐎 StableUp</h1>
    <p class="lead text-secondary mb-5">
      Gamifica tus hábitos. Cría tus caballos. Compite en carreras.
    </p>

    <div class="d-flex gap-3 flex-wrap justify-content-center">
      <button class="btn btn-dark btn-lg px-4" data-bs-toggle="modal" data-bs-target="#loginModal">
        Iniciar sesión
      </button>
      <button id="boton-crear-usuario" class="btn btn-dark btn-lg px-4" data-bs-toggle="modal"
        data-bs-target="#modalCrear">Crear usuario</button>

    </div>
  </main>

  <!-- Lista login -->
  <div class="modal fade" id="loginModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Elige tu usuario</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="lista-usuarios-login" class="d-flex flex-column gap-2"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="config/apiConfig.js"></script>
  <script type="module" src="js/components/usuariosModalComponente.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
